<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>　ᵔ　　🥛　　owivan　　₊</title>
  <link rel="icon" type="image/x-icon" href="anaxachibi.png">
  <link href="https://fonts.googleapis.com/css2?family=Felipa&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      background: #efece5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      font-family: "Felipa", serif;
      font-weight: 400;
      font-style: normal;
    }

    /* Container estilo exatamente igual à foto */
    .neocities-container {
      background: #fffee4;
      border: 3px double #665e52;
      padding: 25px;
      width: 480px;
      position: relative;
    }

    /* Efeito de "rasgado/antigo" no canto superior */
    .neocities-container::before {
      content: "/ᐠ𝅒_𝅒ᐟ\ﾉ";
      position: absolute;
      top: -15px;
      left: 20px;
      background: #fffee4;
      color: #243757;
      font-size: 12px;
      letter-spacing: 4px;
      padding: 0 8px;
    }

    /* Título estilo "welcome to my site" */
    .container-header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px dashed #9fd6d2;
      padding-bottom: 12px;
    }

    .container-header h1 {
      color: #2b4e72;
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: normal;
      text-transform: uppercase;
    }

    .container-header p {
      color: #27b1bf;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    /* Área da imagem - centralizada */
    .image-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      padding: 15px;
      background: #181619;
      border: 1px solid #f5e3ae;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Estilo da imagem */
    .image-area img {
      max-width: 100%;
      height: auto;
      display: block;
      border: 2px solid #00686c;
      filter: grayscale(20%);
      transition: all 0.3s ease;
    }

    .image-area img:hover {
      filter: grayscale(0%);
      transform: scale(1.02);
      border-color: #32c2b9;
    }

    /* Texto "glitch" estilo computador antigo */
    .status-text {
      text-align: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px dashed #9fd6d2;
      color: #000000;
      font-size: 0.7rem;
      letter-spacing: 1px;
    }

    .status-text .blink {
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Detalhe decorativo */
    .corner-deco {
      position: absolute;
      bottom: 8px;
      right: 12px;
      color: #ff705f;
      font-size: 10px;
    }

    /* Responsivo */
    @media (max-width: 550px) {
      .neocities-container {
        width: 95%;
        padding: 18px;
      }
      .container-header h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="neocities-container">
    <div class="container-header">
      <h1> welcome to my site! </h1>
      <p>on this website you can find everything about me</p>
    </div>

    <!-- Área APENAS com a imagem -->
    <div class="image-area">
      <a href="home.html">
      <img src="shirogif.gif">
    </div>

    <div class="status-text">
      <span>　　　　.　　maid by owivan　　　ׄ  </span><br>
      <span class="blink">_</span>
    </div>

    <div class="corner-deco">
      ✦  이반
    </div>
  </div>
