<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>　ᵔ　　🥛　　owivan　　₊</title>
  <link rel="icon" type="image/x-icon" href="shinn.png">
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+NO:wght@100..400&display=swap" rel="stylesheet">
  
  <style>
    .playwrite-no-<uniquifier> {
      font-family: "Playwrite NO", cursive;
      font-optical-sizing: auto;
      font-weight: <weight>;
      font-style: normal;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    /* Container estilo exatamente igual à foto */
    .neocities-container {
      background: #f7d3bd;
      border: 3px double #1a6ab9;
      outline: 2px solid #d9f2f9;
      outline-offset: 4px;
      padding: 25px;
      width: 480px;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* Efeito de "rasgado/antigo" no canto superior */
    .neocities-container::before {
      content: "( ｡ •̀ ᴖ •́ ｡)";
      position: absolute;
      top: -15px;
      left: 20px;
      background: #f7d3bd;
      color: #b73033;
      font-size: 12px;
      letter-spacing: 4px;
      padding: 0 8px;
    }

    /* Título estilo "welcome to my site" */
    .container-header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px dashed #baf929;
      padding-bottom: 12px;
    }

    .container-header h1 {
      color: #fd8b57;
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: normal;
      text-transform: uppercase;
    }

    .container-header p {
      color: #ef100c;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    /* Área da imagem - centralizada */
    .image-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      padding: 15px;
      background: #fecbde;
      border: 1px solid #e65891;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Estilo da imagem */
    .image-area img {
      max-width: 100%;
      height: auto;
      display: block;
      border: 2px solid #a00b12;
      filter: grayscale(20%);
      transition: all 0.3s ease;
    }

    .image-area img:hover {
      filter: grayscale(0%);
      transform: scale(1.02);
      border-color: #e70128;
    }

    /* Texto "glitch" estilo computador antigo */
    .status-text {
      text-align: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px dashed #baf929;
      color: #286445;
      font-size: 0.7rem;
      letter-spacing: 1px;
    }

    .status-text .blink {
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Detalhe decorativo */
    .corner-deco {
      position: absolute;
      bottom: 8px;
      right: 12px;
      color: #f6f790;
      font-size: 10px;
    }

    /* Responsivo */
    @media (max-width: 550px) {
      .neocities-container {
        width: 95%;
        padding: 18px;
      }
      .container-header h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="neocities-container">
    <div class="container-header">
      <h1>welcome to my site!</h1>
      <p>on this website you can find everything about me</p>
    </div>

    <!-- Área APENAS com a imagem -->
    <div class="image-area">
      <a href="home.html">
      <img src="ironfistleondance.jfif">
    </div>

    <div class="status-text">
      <span>       ݂     .    maid by owivan        ׄ  </span><br>
      <span class="blink">_</span>
    </div>

    <div class="corner-deco">
      ✦  이반
    </div>
  </div>
